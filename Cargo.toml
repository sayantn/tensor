[package]
name    = "tensor"
version = "0.1.0"
edition = "2024"

[features]
default        = ["matrixmultiply", "faer", "blas"]
matrixmultiply = ["dep:matrixmultiply"]
faer           = ["dep:faer"]
blas           = ["dep:cblas-sys"]
nightly        = ["faer/nightly"]

[dependencies]
matrixmultiply = { version = "0.3.11", optional = true }
faer = { version = "0.24.4", default-features = false, features = [
    "std",
    "nightly",
], optional = true }
cblas-sys = { version = "0.3.0", optional = true }
num-traits = { version = "0.2.19", default-features = false }
