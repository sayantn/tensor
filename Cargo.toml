[package]
name    = "tensor"
version = "0.1.0"
edition = "2024"

[features]
default = ["gemm-x86-v4"]

# Scalar support (works standalone with `Naive` or enables `f16` in `gemm`)
f16 = ["dep:half", "gemm?/f16"]

# GEMM Backends
backend-blas           = ["dep:cblas-sys"]
backend-matrixmultiply = ["dep:matrixmultiply"]
backend-gemm           = ["dep:gemm"]

# Backend tuning & architecture extensions (imply their respective backend)
matrixmultiply-constconf = [
    "backend-matrixmultiply",
    "matrixmultiply/constconf",
]
gemm-x86-v4 = ["backend-gemm", "gemm/x86-v4"]
gemm-wasm-simd128 = ["backend-gemm", "gemm/wasm-simd128-enable"]
gemm-apple-amx = ["backend-gemm", "gemm/experimental-apple-amx"]

[dependencies]
num-traits = { version = "0.2.19", default-features = false }

half = { version = "2.7.1", features = ["num-traits"], optional = true }

cblas-sys = { version = "0.3.0", optional = true }
gemm = { version = "0.19.0", default-features = false, features = [
    "std",
    "x86-v4",
], optional = true }
matrixmultiply = { version = "0.3.11", optional = true }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name    = "gemm"
harness = false

[[bench]]
name    = "linalg"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
